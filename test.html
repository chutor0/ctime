<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Test · Chinese Time</title><style>
:root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#233b55;background:#eaf2fb;font-size:19px}*{box-sizing:border-box}body{margin:0;padding:48px 20px}main{max-width:740px;margin:auto}header{margin:0 0 28px}.eyebrow{font-size:13px;font-weight:700;letter-spacing:2px;color:#557ba2;text-transform:uppercase}h1{font-size:clamp(32px,6vw,45px);letter-spacing:-1.5px;margin:10px 0}header p{line-height:1.6;color:#567087;margin:0;max-width:600px}input{width:100%;font:inherit;padding:15px 18px;border:1px solid #bdd0e4;border-radius:14px;background:#f9fcff;color:#233b55;margin:0 0 22px}input:focus{outline:3px solid #a8caec;outline-offset:2px}.card{background:#fff;border:1px solid #d1dfed;border-radius:20px;overflow:hidden;box-shadow:0 12px 40px #214b7310}table{border-collapse:collapse;width:100%;text-align:left}thead{background:#dceafa;font-size:15px;color:#456582}th,td{padding:16px 27px}thead th:first-child{width:33%}tbody tr+tr{border-top:1px solid #e6eef6}tbody tr:nth-child(even){background:#f7faff}.han{display:block;font-family:"PingFang SC","Microsoft YaHei",serif;font-size:29px;font-weight:600;letter-spacing:3px}.pinyin{display:block;font-size:15px;font-weight:400;color:#6b829a;margin-top:4px;letter-spacing:.4px}.time{font-size:21px;font-weight:500;font-variant-numeric:tabular-nums;white-space:nowrap}.empty{padding:24px;text-align:center;color:#647b91}footer{font-size:14px;color:#647b91;line-height:1.7;padding:20px 4px}footer strong{color:#456582}@media(max-width:480px){body{padding:28px 14px}th,td{padding:15px 17px}.time{font-size:18px}.han{font-size:27px}header p{font-size:17px}}@media print{body{padding:0;background:white}input{display:none}.card{box-shadow:none}th,td{padding:10px 20px}footer{font-size:12px}}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px}.test-link{font-size:16px;color:#456582;text-decoration:none;padding:7px 13px;border:1px solid #bdd0e4;border-radius:10px;white-space:nowrap}.test-link:hover{background:#dceafa}.test-link:focus-visible{outline:3px solid #a8caec}@media print{.test-link{display:none}}
a{color:#456582;font-size:16px}header{margin-bottom:20px}.question{text-align:center;margin:18px 0 24px}.question .han{font-size:68px}.question .pinyin{font-size:21px}.question p{color:#567087;font-size:18px}.options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}button{font:inherit;cursor:pointer;border:1px solid #bdd0e4;border-radius:13px;background:#fff;color:#233b55;padding:16px 8px;min-height:58px;font-size:19px}button:hover:not(:disabled){background:#dceafa}button:focus-visible{outline:3px solid #7da7d2;outline-offset:2px}button:disabled{cursor:default;opacity:1}button.correct{background:#dceafa;border:2px solid #356c9c;color:#183e63}button.wrong{background:#fbe9e9;border:2px solid #bd6464;color:#843e3e}#feedback{min-height:52px;text-align:center;line-height:1.5;margin:18px 0 10px}#next{display:block;width:100%;background:#315f8c;color:white}#next[hidden]{display:none}@media(max-width:480px){button{font-size:16px;padding:14px 5px}.question{margin:12px 0 18px}.question .han{font-size:58px}}@media(max-width:350px){button{font-size:14px}}</style></head><body><main><header><a href="index.html">← Reference</a></header><section class="question" aria-label="Question"><span id="han" class="han" lang="zh-Hans"></span><span id="pinyin" class="pinyin"></span><p>What time does this represent?</p></section><div id="options" class="options" aria-label="Time ranges"></div><p id="feedback" role="status" aria-live="polite"></p><button id="next" hidden>Next</button></main><script>
const data=[["子", "zǐ", "11:00 p.m. - 1:00 a.m."], ["丑", "chǒu", "1:00 a.m. - 3:00 a.m."], ["寅", "yín", "3:00 a.m. - 5:00 a.m."], ["卯", "mǎo", "5:00 a.m. - 7:00 a.m."], ["辰", "chén", "7:00 a.m. - 9:00 a.m."], ["巳", "sì", "9:00 a.m. - 11:00 a.m."], ["午", "wǔ", "11:00 a.m. - 1:00 p.m."], ["未", "wèi", "1:00 p.m. - 3:00 p.m."], ["申", "shēn", "3:00 p.m. - 5:00 p.m."], ["酉", "yǒu", "5:00 p.m. - 7:00 p.m."], ["戌", "xū", "7:00 p.m. - 9:00 p.m."], ["亥", "hài", "9:00 p.m. - 11:00 p.m."]];
const han=document.querySelector('#han'),pinyin=document.querySelector('#pinyin'),options=document.querySelector('#options'),feedback=document.querySelector('#feedback'),next=document.querySelector('#next');
let deck=[],current=-1,answered=false;
function refill(){deck=data.map((_,i)=>i);for(let i=deck.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]];}if(deck[deck.length-1]===current){[deck[0],deck[deck.length-1]]=[deck[deck.length-1],deck[0]];}}
function ask(){if(!deck.length)refill();current=deck.pop();answered=false;han.textContent=data[current][0];pinyin.textContent=data[current][1];feedback.textContent='';next.hidden=true;options.replaceChildren();data.forEach((item,i)=>{const b=document.createElement('button');b.type='button';b.textContent=item[2].replaceAll(':00','');b.addEventListener('click',()=>answer(i));options.append(b);});}
function answer(choice){if(answered)return;answered=true;[...options.children].forEach((b,i)=>{b.disabled=true;if(i===current)b.classList.add('correct');if(i===choice&&choice!==current)b.classList.add('wrong');});feedback.textContent=choice===current?'Correct.':'Correct answer: '+data[current][2].replaceAll(':00','');next.hidden=false;}
next.addEventListener('click',()=>{ask();options.firstElementChild.focus({preventScroll:true});});ask();
</script></body></html>
